<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subtitle layout regression fixture</title>
  <style>
    body {
      font:
        16px/1.5 system-ui,
        sans-serif;
      color: #17282d;
      background: #edf1f2;
      padding: 24px;
      margin: 0;
    }
    main {
      max-width: 850px;
      margin: auto;
    }
    label {
      display: inline-flex;
      gap: 8px;
      margin-right: 16px;
      margin-bottom: 12px;
    }
    select,
    button {
      font: inherit;
    }
    .frame {
      width: 320px;
      max-width: 100%;
      height: 210px;
      background: #29414d;
      margin: 8px 0 24px;
    }
    .frame > * {
      width: 100%;
      height: 100%;
    }
  </style>
  <main>
    <h1>Subtitle layout</h1>
    <p>
      Actual built-in theme styles, native WebVTT parsing, and the player’s subtitle
      fitting helper. Synthetic text and a locally generated blank video; no external
      requests.
    </p>
    <label
      >Width
      <select id="width">
        <option>320</option>
        <option>360</option>
        <option>640</option>
      </select></label
    >
    <label><input id="fullscreen" type="checkbox" /> Fullscreen styling</label>
    <label><input id="legacy" type="checkbox" /> Previous layout</label>
    <label
      >Cue
      <select id="cue">
        <option value="two">Two lines</option>
        <option value="short">Short</option>
        <option value="wide">Wide characters</option>
        <option value="uploaded">Three authored lines</option>
      </select></label
    >
    <div id="themes"></div>
  </main>
  <script type="module">
    import { LitElement, html, css } from 'lit';
    import 'media-chrome';
    import 'media-chrome/menu';
    import '../src/components/audio-track-menu.ts';
    import '../src/components/captions-menu-button.ts';
    import { build as buildDefault } from '../src/themes/default.ts';
    import { build as buildDolphin } from '../src/themes/dolphin.ts';
    import { build as buildSynthwave } from '../src/themes/synthwave.ts';
    import { subtitleCueContent } from '../src/utils/subtitle_cues.ts';
    import {
      fitSubtitleText,
      observeSubtitleLayout,
    } from '../src/utils/subtitle_layout.ts';
    const cases = {
      two: 'We laten zien hoe je een video toevoegt,\nondertitels maakt en daarna verder kijkt.',
      short: 'Hello there.',
      wide: 'WONDERFUL MOMENTS WITH MANY WIDE WORDS\nWILL MAKE THIS A DEMANDING LAYOUT TEST.',
      uploaded: 'First authored line\nSecond authored line\nThird authored line',
    };
    const themes = [];
    for (const [name, build] of [
      ['default', buildDefault],
      ['dolphin', buildDolphin],
      ['synthwave', buildSynthwave],
    ]) {
      build(name, LitElement, html, css);
      const title = document.createElement('h2');
      title.textContent = name;
      const frame = document.createElement('div');
      frame.className = 'frame';
      frame.dataset.theme = name;
      const theme = document.createElement(`theme-${name}`);
      const video = document.createElement('video');
      video.slot = 'media';
      video.src = './fixtures/subtitles/blank.mp4';
      video.muted = true;
      video.playsInline = true;
      theme.append(video);
      frame.append(theme);
      document.querySelector('#themes').append(title, frame);
      await theme.updateComplete;
      const caption = theme.shadowRoot.querySelector('#subtitles_text');
      themes.push({ name, frame, theme, caption, cleanup: null });
    }
    function update() {
      for (const item of themes) {
        item.cleanup?.();
        item.frame.style.width = document.querySelector('#width').value + 'px';
        item.theme.shadowRoot
          .querySelector('media-controller')
          .toggleAttribute(
            'mediaisfullscreen',
            document.querySelector('#fullscreen').checked,
          );
        item.caption.removeAttribute('style');
        item.caption.style.opacity = '1';
        item.caption.replaceChildren(
          subtitleCueContent(
            new VTTCue(0, 4, cases[document.querySelector('#cue').value]),
          ),
        );
        if (document.querySelector('#legacy').checked) {
          Object.assign(item.caption.style, {
            display: 'flex',
            fontSize: '19px',
            lineHeight: '24px',
            maxWidth: '80%',
          });
        } else {
          item.cleanup = observeSubtitleLayout(item.caption);
          fitSubtitleText(item.caption);
        }
      }
    }
    for (const input of document.querySelectorAll('select, input'))
      input.addEventListener('change', update);
    window.subtitleLayoutFixture = { themes, update };
    update();
  </script>
</html>
