name: Release package
concurrency:
  group: components-release
  cancel-in-progress: false
permissions:
  id-token: write
  contents: write
  pull-requests: read
  actions: read
on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release type (one of): patch, minor, major, prepatch, preminor, premajor, prerelease'
        required: false
        default: patch
      publish-only:
        description: 'If true, only run npm publish (no version bump, changelog, or GitHub release)'
        required: false
        default: 'false'
      publish-tag:
        description: 'npm dist-tag to publish under when publish-only=true (e.g. latest, beta)'
        required: false
        default: latest
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Checkout project repository
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import GPG key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v4
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org/
          node-version: '24'

      - name: Install locked dependencies
        run: npm ci

      # Configure Git
      - name: Git configuration
        run: |
          git config --global user.email "${{ steps.import-gpg.outputs.email }}"
          git config --global user.name "${{ steps.import-gpg.outputs.name }}"

      - name: Set publish-only env
        if: github.event.inputs.publish-only == 'true'
        env:
          PUBLISH_TAG: ${{ github.event.inputs.publish-tag }}
        run: |
          [[ "$PUBLISH_TAG" =~ ^[a-z][a-z0-9-]*$ ]] || exit 1
          VERSION=$(node -p 'require("./package.json").version')
          echo "NEW_VERSION=v${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$PUBLISH_TAG" >> "$GITHUB_ENV"

      # Bump package version
      # Use tag latest
      - name: Bump release version
        if: github.event.inputs.publish-only != 'true' && startsWith(github.event.inputs.release-type, 'pre') != true
        run: |
          echo "NEW_VERSION=$(npm --no-git-tag-version version $RELEASE_TYPE)" >> $GITHUB_ENV
          echo "RELEASE_TAG=latest" >> $GITHUB_ENV
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release-type }}

      # Bump package pre-release version
      # Use tag beta for pre-release versions
      - name: Bump pre-release version
        if: github.event.inputs.publish-only != 'true' && startsWith(github.event.inputs.release-type, 'pre')
        run: |
          echo "NEW_VERSION=$(npm --no-git-tag-version --preid=beta version $RELEASE_TYPE)" >> $GITHUB_ENV
          echo "RELEASE_TAG=beta" >> $GITHUB_ENV
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release-type }}

      # Update changelog unreleased section with new version
      - name: Update changelog
        if: github.event.inputs.publish-only != 'true'
        uses: superfaceai/release-changelog-action@v1
        with:
          path-to-changelog: CHANGELOG.md
          version: ${{ env.NEW_VERSION }}
          operation: release

      # Read version changelog
      - id: get-changelog
        name: Get version changelog
        if: github.event.inputs.publish-only != 'true'
        uses: superfaceai/release-changelog-action@v1
        with:
          path-to-changelog: CHANGELOG.md
          version: ${{ env.NEW_VERSION }}
          operation: read

      # Commit changes
      - name: Commit CHANGELOG.md and package.json changes and create tag
        if: github.event.inputs.publish-only != 'true'
        run: |
          git add "package.json"
          git add "package-lock.json"
          git add "CHANGELOG.md"
          git commit -m "release ${{ env.NEW_VERSION }}"
          git tag "${{ env.NEW_VERSION }}"

      # Build once: both npm and the CDN use this exact package tarball.
      - name: Build release and CDN artifact
        run: |
          npm run build:prod
          mkdir release-tarball release-package
          npm pack --ignore-scripts --pack-destination release-tarball
          tar -xzf release-tarball/*.tgz -C release-package --strip-components=1
          npm run build:cdn -- release-package cdn-artifact
          python3 scripts/deploy-cdn.py cdn-artifact

      - name: Save CDN artifact for deployment and rollback
        uses: actions/upload-artifact@v4
        with:
          name: components-cdn
          path: |
            cdn-artifact/manifest.json
            cdn-artifact/payloads/
          retention-days: 90
          if-no-files-found: error

      - name: Save exact npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: components-npm
          path: release-tarball/*.tgz
          retention-days: 90

      - name: Push to protected branch
        if: github.event.inputs.publish-only != 'true'
        uses: CasperWA/push-protected@v2
        with:
          token: ${{ secrets.PUSH_TO_PROTECTED_BRANCH }}
          branch: main
          unprotect_reviews: true
          tags: true

      # Update GitHub release with changelog
      - name: Update GitHub release documentation
        if: github.event.inputs.publish-only != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.NEW_VERSION }}
          body: ${{ steps.get-changelog.outputs.changelog }}
          prerelease: ${{ startsWith(github.event.inputs.release-type, 'pre') }}
          token: ${{ secrets.PUSH_TO_PROTECTED_BRANCH }}

      # Publish version to public repository
      - name: Publish
        run: npm publish release-tarball/*.tgz --ignore-scripts --access public --tag "$RELEASE_TAG"

      - name: Export release tag
        id: release-tag
        run: echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}

  deploy-cdn:
    needs: release
    uses: ./.github/workflows/deploy_cdn.yml
    with:
      run-id: ${{ github.run_id }}
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
